<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#090d16"/>
    </linearGradient>

    <!-- Glowing Text Gradient -->
    <linearGradient id="text-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>

    <!-- Accent Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Wave / Pulse Animations for dynamic graphics in background -->
    <style>
      .pulse-circle {
        animation: pulse 4s infinite ease-in-out alternate;
      }
      .scan-line {
        animation: scan 6s infinite linear;
      }
      .wave-path {
        animation: float 5s infinite ease-in-out alternate;
      }
      .card-bg {
        animation: cardPulse 3s infinite ease-in-out alternate;
      }
      @keyframes pulse {
        0% { transform: scale(0.95); opacity: 0.2; }
        100% { transform: scale(1.08); opacity: 0.45; }
      }
      @keyframes scan {
        0% { transform: translateY(-50px); opacity: 0.1; }
        50% { opacity: 0.3; }
        100% { transform: translateY(350px); opacity: 0.1; }
      }
      @keyframes float {
        0% { transform: translateY(0px) rotate(0deg); }
        100% { transform: translateY(-12px) rotate(1.5deg); }
      }
      @keyframes cardPulse {
        0% { stroke-opacity: 0.3; }
        100% { stroke-opacity: 0.8; }
      }
    </style>
  </defs>

  <!-- Background -->
  <rect width="1200" height="320" rx="16" fill="url(#bg-grad)"/>

  <!-- DYNAMIC BACKGROUND GRAPHICS (Layered strictly behind text) -->
  <g class="wave-path" opacity="0.25">
    <path d="M-100,240 C150,160 350,300 600,200 C850,100 1050,260 1300,180 L1300,340 L-100,340 Z" fill="#4f46e5" />
    <path d="M-100,260 C200,280 450,140 700,220 C950,300 1100,160 1300,240 L1300,340 L-100,340 Z" fill="#0284c7" opacity="0.6"/>
  </g>

  <!-- Dynamic Tech Grid / Network Nodes (Background) -->
  <g stroke="#38bdf8" stroke-width="0.75" opacity="0.2">
    <line x1="100" y1="40" x2="100" y2="280" />
    <line x1="300" y1="40" x2="300" y2="280" />
    <line x1="900" y1="40" x2="900" y2="280" />
    <line x1="1100" y1="40" x2="1100" y2="280" />
    <line x1="40" y1="80" x2="1160" y2="80" />
    <line x1="40" y1="240" x2="1160" y2="240" />
  </g>

  <!-- Scanning Line Effect -->
  <line class="scan-line" x1="0" y1="0" x2="1200" y2="0" stroke="#38bdf8" stroke-width="2" filter="url(#glow)" opacity="0.3"/>

  <!-- Right-side Decorative Video AI HUD Graphics (Pill / Dynamic Nodes in background) -->
  <g transform="translate(860, 50)" opacity="0.45">
    <!-- Camera Viewfinder Bounding Box Graphics -->
    <rect class="card-bg" x="0" y="0" width="280" height="200" rx="12" fill="#0f172a" stroke="#818cf8" stroke-width="1.5" stroke-dasharray="6,6"/>
    <!-- Simulated Object Detection Boxes -->
    <rect x="30" y="40" width="90" height="70" rx="4" fill="none" stroke="#38bdf8" stroke-width="1.5"/>
    <text x="35" y="34" fill="#38bdf8" font-family="Arial, sans-serif" font-size="10" font-weight="bold">PERSON 99.4%</text>

    <rect x="140" y="90" width="110" height="80" rx="4" fill="none" stroke="#c084fc" stroke-width="1.5"/>
    <text x="145" y="84" fill="#c084fc" font-family="Arial, sans-serif" font-size="10" font-weight="bold">VEHICLE 98.7%</text>

    <!-- Animated Waveform / Spectrum -->
    <path d="M30,160 L50,145 L70,165 L90,140 L110,170 L130,150 L150,160 L170,135 L190,165 L210,145 L230,160" fill="none" stroke="#38bdf8" stroke-width="2" opacity="0.8"/>
  </g>

  <!-- Left-side Glow Pulse -->
  <circle class="pulse-circle" cx="150" cy="160" r="140" fill="#6366f1" filter="url(#glow)"/>

  <!-- FOREGROUND CONTENT: Title & Subtitle (Guaranteed 100% visible, fully clear above graphics) -->
  <!-- Main Title Icon + Text Group -->
  <g transform="translate(70, 115)">
    <!-- Video AI Camera Icon -->
    <g transform="translate(0, -50)">
      <rect x="0" y="0" width="56" height="40" rx="8" fill="url(#text-grad)" filter="url(#glow)"/>
      <polygon points="56,12 76,2 76,38 56,28" fill="#c084fc" filter="url(#glow)"/>
      <circle cx="28" cy="20" r="10" fill="#0f172a"/>
      <circle cx="28" cy="20" r="5" fill="#38bdf8"/>
    </g>

    <!-- Main Title Text -->
    <text x="95" y="-12" fill="url(#text-grad)" font-family="System-UI, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="44" font-weight="900" letter-spacing="1">
      Awesome-Video-AI-Analytics
    </text>

    <!-- Subtitle Text -->
    <text x="95" y="28" fill="#e2e8f0" font-family="System-UI, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="500" letter-spacing="0.5" opacity="0.95">
      📹 Curated Ecosystem of Video AI, Computer Vision &amp; Multimodal Reasoning Tools
    </text>

    <!-- Key Feature Badges / Highlights (Foreground) -->
    <g transform="translate(95, 65)">
      <!-- Badge 1 -->
      <rect x="0" y="0" width="140" height="26" rx="13" fill="#1e293b" stroke="#38bdf8" stroke-width="1"/>
      <text x="70" y="17" fill="#38bdf8" font-family="sans-serif" font-size="11" font-weight="bold" text-anchor="middle">⚡ SaaS &amp; Open-Source</text>

      <!-- Badge 2 -->
      <rect x="150" y="0" width="150" height="26" rx="13" fill="#1e293b" stroke="#818cf8" stroke-width="1"/>
      <text x="225" y="17" fill="#818cf8" font-family="sans-serif" font-size="11" font-weight="bold" text-anchor="middle">🤖 Multimodal LMM / VLM</text>

      <!-- Badge 3 -->
      <rect x="310" y="0" width="140" height="26" rx="13" fill="#1e293b" stroke="#c084fc" stroke-width="1"/>
      <text x="380" y="17" fill="#c084fc" font-family="sans-serif" font-size="11" font-weight="bold" text-anchor="middle">🔍 Video RAG &amp; Search</text>
    </g>
  </g>
</svg>
